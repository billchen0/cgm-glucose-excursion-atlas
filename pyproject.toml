[project]
name = "cgm-excursions"
version = "0.1.0"
description = "Local-first CGM excursion detection workspace: readable preprocessing pipeline plus a dashboard that renders participant data dynamically."
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
cgm = "cgm_excursions.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cgm_excursions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
